<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legal Lab Casebook</title>
<meta name="theme-color" content="#3b2a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casebook">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --fs:22px;
  --bg:#faf7f2; --card:#fff; --ink:#1f1a14; --muted:#6b6257; --line:#e6ded2;
  --accent:#8a4b16; --accentbg:#fbeedd; --chip:#f1e7da; --head:#3b2a1a;
  --crim:#7a2e2e; --civ:#1f5c5a;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17130f; --card:#211b15; --ink:#f1ebe3; --muted:#b3a899; --line:#3a3027;
    --accent:#f0b474; --accentbg:#3b2a18; --chip:#2f261d; --head:#120e0a; --crim:#e59a9a; --civ:#86d0cc; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:var(--fs);line-height:1.6;
  -webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
.ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
header .row{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px}
header .t{flex:1;font-size:19px;font-weight:700;cursor:pointer}
header button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;font-size:17px;font-weight:700;
  min-width:44px;height:40px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:18px 18px 90px}
h1{font-size:1.45em;line-height:1.25;margin:.3em 0 .2em}
h2{font-size:1.12em;margin:1.4em 0 .4em;color:var(--accent)}
p{margin:0 0 .9em}
.tag{font-size:.82em;color:var(--muted);font-style:italic;margin-bottom:1em}
.meta{font-size:15px;color:var(--muted);letter-spacing:.02em}
.type{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;color:#fff}
.type.Criminal{background:var(--crim)} .type.Civil{background:var(--civ)}
@media (prefers-color-scheme: dark){ .type{color:#17130f} }
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 14px;
  color:inherit;text-decoration:none;cursor:pointer}
.card h3{font-size:1.08em;margin:.35em 0 .15em;line-height:1.3}
.card .tg{font-size:.8em;color:var(--muted)}
.card .read{float:right;font-size:14px;color:var(--civ);font-weight:700}
.c{font:inherit;color:inherit;background:var(--accentbg);border:0;border-bottom:2px solid var(--accent);
  border-radius:4px 4px 0 0;padding:0 3px;cursor:pointer;display:inline}
.glance{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin:6px 0 10px}
.glance div{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88em;line-height:1.4}
.glance div:last-child{border-bottom:0}
.glance b{flex:0 0 32%;color:var(--muted);font-weight:600}
.chips{margin:6px 0 4px}
.chip{display:inline-block;background:var(--chip);color:var(--ink);border:0;border-radius:20px;padding:6px 12px;margin:0 6px 8px 0;
  font-size:16px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.think{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.think .q{margin-bottom:.4em}
.think button{font-size:16px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);border-radius:10px;
  padding:8px 12px;cursor:pointer}
.think .a{border-left:4px solid var(--accent);padding-left:12px;margin-top:10px;color:var(--ink);font-size:.92em}
.src{font-size:15px;color:var(--muted);line-height:1.45}
.src li{margin-bottom:4px}
.navrow{display:flex;gap:10px;margin-top:24px}
.btn{flex:1;font-size:17px;font-weight:700;border:0;border-radius:12px;padding:14px;cursor:pointer;background:var(--accent);color:#fff}
.btn.sec{background:var(--chip);color:var(--ink)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;
  padding:12px 20px calc(24px + env(safe-area-inset-bottom));max-height:75vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease;
  box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.sheet.open{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:.1em 0 .4em;font-size:1.15em;color:var(--accent)}
.sheet .lesson{display:inline-block;font-size:15px;background:var(--chip);border-radius:8px;padding:4px 10px;margin:4px 0 10px}
.sheet .also{font-size:16px;color:var(--muted);margin-top:8px}
.sheet .also a{color:var(--accent);cursor:pointer;text-decoration:underline}
.intro{font-size:.9em;color:var(--muted)}
.empty{color:var(--muted);font-style:italic}
</style>
</head>
<body>
<header class="ui"><div class="row">
  <div class="t" id="home">⚖️ Casebook</div>
  <button id="smaller" aria-label="Smaller text">A−</button>
  <button id="bigger" aria-label="Larger text">A+</button>
</div></header>
<main id="app"></main>
<div class="sheet-bg" id="sbg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<script src="cases.js"></script>
<script src="app.js"></script>
</body>
</html>
